; tag_tuning.ini — MBAACC native TAG levers (PovertyCaster). Guide: hantei-chan docs/tag_research/TAG_TUNING_GUIDE.md
; Copy this file next to MBAA.exe as tag_tuning.ini. With no file, every lever is at its default (the stock MBAC
; swap plus the two tag-lock guards), which is exactly the behaviour before this file existed.
;
; Resolution: defaults <- [style.<active_style>] (or a built-in style of that name) <- [tuning] keys <- env.
; Built-in styles (always available, an ini section of the same name replaces one): Stock, Classic, ActiveTag,
; Chaos, DropIn, Assist, Freestyle.
; OFFLINE the game re-reads this file within a second of saving it, and after every character reload (Shift+N /
; the Hantei-chan link). In ANY session (netplay, spectate, replay, recording, synctest) it is read once at the
; session start and frozen; both players must have the same resolved values (the log prints a sha256).
; The F3 > Tag panel edits the same values live and can save them here (it rewrites the file; the previous copy is
; kept as tag_tuning.ini.bak, and comments like these are not preserved).

[tuning]
active_style=Classic
koRule=oneDown
; any lever here overrides the style, e.g.
cancelWindowTicks=4
myNote=kept verbatim   ; an unknown key: a warning, never touched

; ---- every lever: key = default   [group] range — what it does ----
;   cooldownTicks = 120   [Swap] 1..6000 — ticks in state 101 before the team can tag again (stock 120)
;   guardSwapHit = 1   [Guards] 0|1 — S1: a hit in the 2-tick swap window cancels the swap (else tag-lock)
;   exitTimeoutTicks = 180   [Guards] 0..6000 — S2: force-park an exit still running this long after the swap (0 = off)
;   regen = 0   [Regen] 0|1 — MBAC: the resting partner regains red health
;   regenPerTick = 1   [Regen] 0..11400 — health per tick while resting (MBAC 1)
;   parkX = -102400   [Park] -2000000..2000000 (boot only) — resting partner x (byte patch at boot: restart to change)
;   parkY = 0   [Park] -2000000..2000000 — resting partner y
;   pinTeamPoint = 1   [Harness] 0|1 (harness only) — stress harness: pin each team's point's health (not netplay)
;   cancelWindowTicks = -1   [Tag-in cancel] -1..255 — tag-in actionable from this tick (-1 = the pattern's own flags)
;   cancelNormals = 1   [Tag-in cancel] 0|1 — window allows normals / jumps / guard / walk
;   cancelSpecials = 1   [Tag-in cancel] 0|1 — window allows command-list specials / supers
;   airTagOut = 0   [Air tag] 0|1 — 22D while airborne; the outgoing starts at its lift-off frame
;   airTagIn = 0   [Air tag] 0|1 — the incoming enters airborne (entryStyle drop / arc)
;   entryStyle = edge   [Entry] edge|drop|arc — edge = stock dash-in; drop / arc need airTagIn
;   entryX = 40960   [Entry] 0..200000 — edge / arc start: distance from the camera centre (stock 40960)
;   dropX = 16384   [Entry] -200000..200000 — drop start: distance from the camera centre, own side
;   entryY = -40000   [Entry] -200000..0 — drop start height (negative = up)
;   arcY = 0   [Entry] -200000..0 — arc start height
;   arcVelX = 900   [Entry] -10000..10000 — arc forward speed
;   arcVelY = -2800   [Entry] -10000..10000 — arc initial vertical speed (negative = up)
;   dropVelY = 0   [Entry] -10000..10000 — drop initial vertical speed (positive = down)
;   entryGravity = 150   [Entry] 0..2000 — air entries: y acceleration per tick
;   entryAnchor = camera   [Entry] camera|point — x distances measured from: camera = screen edge, point = behind the point
;   entryInvulnTicks = 0   [Entry] 0..255 — strike + throw invulnerability ticks on entry (0 = none, stock)
;   tagIn = 0   [Patterns] 0..999 ([char.*] only) — tag-in pattern number (0 = the TeamChangeData table)
;   tagOut = 0   [Patterns] 0..999 ([char.*] only) — tag-out pattern number (0 = the TeamChangeData table)
;   koRule = oneDown   [KO rule] oneDown|allDown — oneDown = the point's KO ends the round; allDown = forced tag-in
;                      (old names accepted: mbac = oneDown, mbaa / marvel = allDown; env PCHOST_MBAACC_TAG_RULE)
;   forcedEntryDelayTicks = 60   [KO rule] 0..600 — allDown: ticks from the point's KO to the partner's entry
;   swapRedKeepPct = 50   [Entry] 0..100 (also per char) — % of the incoming's red-health gap kept at the swap (stock 50)
;   assistEnabled = 0   [Assist] 0|1 — the assist button (FN1) calls the partner in for one action
;   assistEntry = behind   [Assist] behind|edge|drop|arc (also per char) — the default entry (a slot's own entry wins)
;   assistOffsetX = 36000   [Assist] 0..200000 (also per char) — behind / drop: start distance behind the point
;   assistEntryTicks = 8   [Assist] 0..120 (also per char) — behind / edge: entry ticks before the action (drop / arc: on landing)
;   assistCooldownTicks = 180   [Assist] 0..6000 (also per char) — ticks after the assist parks before the next call
;   assistMaxTicks = 150   [Assist] 1..6000 (also per char) — the action is cut off after this many ticks
;   assistDamagePct = 100   [Assist] 0..1000 (also per char) — % of a hit's damage the assist takes (100 = stock)
;   assistMeter = 1   [Assist] 0|1 — meter actions allowed (paid from the POINT's meter); the defaults never cost meter
;   assistPromote = 1   [Assist] 0|1 — 22D during an assist promotes the assist to point
; Directional assist slots, FN1 + a direction read relative to the point's facing (6 = toward the opponent):
;   assist.<d>.entry = default|behind|edge|drop|arc     <d> = 5, 2, 6, 4, 8 (also in [tuning])
;   assist.<d>.pattern = <hantei pattern number>       [char.*] only: played directly
;   assist.<d>.command = <_c.txt command id>           [char.*] only: that command's pattern, played directly
;   assist.<d>.motion = <input, e.g. 236C>             [char.*] only: fed through the character's command interpreter
; Inside a slot: pattern > command > motion. A slot with no action uses slot 5's; with neither, the character default
; (its lowest-id meterless motion+A special; TAG_TUNING_GUIDE.md lists every one).
; Per character: a [char.<file>] section (the character's FILE name, e.g. sion, miyako, v_sion, warc) may set any of
; cancelWindowTicks cancelNormals cancelSpecials airTagOut airTagIn entryStyle entryX dropX entryY arcY arcVelX
; arcVelY dropVelY entryGravity entryAnchor entryInvulnTicks swapRedKeepPct tagIn tagOut assistEntry assistOffsetX
; assistEntryTicks assistCooldownTicks assistMaxTicks assistDamagePct and the assist.<d>.* slots. It overrides the values above
; for that character only (its own tag-in / tag-out / assist), on top of whichever style is active.

; ---- styles (TAG_STYLES_REFERENCE.md). These repeat the built-ins so they can be edited here. ----
[style.Classic]
regen=1
regenPerTick=1

[style.ActiveTag]
regen=1
airTagOut=1
cancelWindowTicks=4
cooldownTicks=60

[style.Chaos]
regen=1
regenPerTick=2
airTagOut=1
airTagIn=1
entryStyle=arc
cancelWindowTicks=0
cooldownTicks=1

[style.DropIn]
regen=1
airTagIn=1
entryStyle=drop

[style.Assist]
regen=1
assistEnabled=1

[style.Freestyle]
regen=1
regenPerTick=2
airTagOut=1
airTagIn=1
entryStyle=arc
cancelWindowTicks=0
cooldownTicks=1
assistEnabled=1
assistEntry=edge
assistEntryTicks=12
assistCooldownTicks=90

; ---- per-character examples (uncomment to use) ----
; [char.miyako]
; cancelWindowTicks=6      ; her stock tag-in never allows movement; open it at tick 6
; [char.sion]
; entryAnchor=point        ; appear behind the point instead of at the screen edge
; entryX=12000
; entryInvulnTicks=8
; [char.akiha]
; tagIn=250                ; an alternate entry authored in Hantei-chan (must exist in her loaded HA6)
; [char.shiki]
; assist.5.entry=behind    ; FN1 alone: run in from behind the point ...
; assist.5.command=45      ; ... and play what command 45 (236A) plays, pattern 105
; assist.2.entry=drop      ; 2+FN1: drop from above ...
; assist.2.motion=236C     ; ... and input 236C (EX: costs the point's meter, needs assistMeter=1)
; assist.4.entry=edge      ; 4+FN1: from the screen edge, slot 5's action
; assist.6.pattern=455     ; 6+FN1: hantei pattern 455 directly

[char.shiki]
cancelWindowTicks=6      ; open the tag-in early
entryStyle=drop
entryInvulnTicks=8
tagIn=241
assist.5.entry=behind
assist.5.command=45
assist.2.entry=drop
assist.2.motion=236C
assist.6.pattern=455
